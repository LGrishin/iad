[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iad-kit"
version = "0.1.0"
description = "Interactive Architecture Diagram toolkit with portable source-backed maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iad = "iadkit.cli:main"

[tool.setuptools.packages.find]
include = ["iadkit*"]

[tool.setuptools.package-data]
iadkit = ["assets/*", "comparison_assets/*", "schemas/*.json", "spec/*.md", "templates/project/*", "templates/project/.gitignore", "templates/project/*/*.json"]
